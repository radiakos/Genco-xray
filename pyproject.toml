[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gencoxray"
version = "0.1.0"
description = "Check GENCO like Newton-Raphson: error checks, AC re-solve selection and stress maps from GENCO's intermediate solutions (GENCO Challenge 2026)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# torch / torch_geometric / torch-scatter / gridfm-graphkit are installed by scripts/00_setup_env.sh
# because torch-scatter wheels must match the CUDA build.
dev = ["pytest>=8", "ruff>=0.6"]
ac = ["lightsim2grid>=0.9", "pandapower>=2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs torch + a downloaded GENCO checkpoint",
  "torch: needs torch (CPU is fine)",
  "slow: > 10 s on a laptop",
]

[tool.ruff]
line-length = 100
target-version = "py310"
