# Template for gridfm-datakit. datagen.write_nk_configs() fills topology_perturbation.k and
# outage_count_probabilities (one-hot at k) and settings.data_dir per k.
network: {name: case118_ieee, source: pglib}
load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 120          # x n_topology_variants ≈ 2400 attempts per k
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0
topology_perturbation:
  type: random
  k: __K__
  n_topology_variants: 20
  elements: [branch, gen]
  outage_count_probabilities: __ONEHOT__
generation_perturbation: {type: cost_permutation, sigma: 1.0}
admittance_perturbation: {type: random_perturbation, sigma: 0.2}
settings:
  num_processes: 6        # 16 GB RAM laptop: one Julia process each
  data_dir: data/case118/data/nk/k__KK__   # datakit writes <data_dir>/case118_ieee/raw/ = graphkit split "nk/kXX"
  large_chunk_size: 1000
  overwrite: true
  mode: pf
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  pf_solver: powermodel
  max_iter: 200
  seed: __SEED__
