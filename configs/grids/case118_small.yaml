name: case118_small
network: case118_ieee
# Robustness variant (M8 review): the IEEE-118 *Small* checkpoint (hidden 24, 12 layers, seed 0) of the same release,
# evaluated on our N-k sets only (unseen by both checkpoints, so no training-split restriction is needed).
# data/case118_small is a directory junction to data/case118 (same raw data and processed caches).
hf_model_repo: gridfm/genco-pf-datakit
hf_files:
  config: case118_ieee/small/seed0/case118_ieee_small_seed0.yaml
  checkpoint: case118_ieee/small/seed0/best_model_state_dict.pt
  normalizer_stats: case118_ieee/small/seed0/normalizer_stats.pt
hf_dataset_repo: gridfm/pf_small_case118_ieee
n_partitions: 25
model_variant: small
splits: [nk/k01, nk/k02, nk/k03, nk/k04, nk/k05, nk/k06, nk/k07, nk/k08, nk/k09, nk/k10]
in_distribution_k: [1]
